name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.0.1
        required: true
        default: v2.0.1

jobs:
  native:
    name: Build ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package: linux-x64-gnu
            binary: claude-adapter-native
          - runner: windows-2025
            package: win32-x64-msvc
            binary: claude-adapter-native.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - run: cargo test --manifest-path native/Cargo.toml
      - run: cargo build --manifest-path native/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.package }}
          path: ../.cc-proxy-target/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Package and create GitHub release
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage offline binaries
        run: |
          mkdir -p bin/linux-x64-gnu bin/win32-x64-msvc
          cp artifacts/native-linux-x64-gnu/claude-adapter-native bin/linux-x64-gnu/
          cp artifacts/native-win32-x64-msvc/claude-adapter-native.exe bin/win32-x64-msvc/
          chmod +x bin/linux-x64-gnu/claude-adapter-native
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml
      - name: Build package artifacts and clean-install test
        env:
          CLEAN_INSTALL: '1'
        run: |
          npm run release:assets
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          zip -j "release/claude-adapter-$PACKAGE_VERSION-offline.zip" "release/claude-adapter-$PACKAGE_VERSION.tgz"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip release/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" release/*.zip release/*.tgz --title "$RELEASE_TAG" --generate-notes
          fi
