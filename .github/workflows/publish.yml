name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.0.1
        required: true
        default: v2.0.1

jobs:
  native:
    name: Build ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package: linux-x64-gnu
            binary: cc-proxy-native
          - runner: macos-15-intel
            package: darwin-x64
            binary: cc-proxy-native
          - runner: macos-14
            package: darwin-arm64
            binary: cc-proxy-native
          - runner: windows-2025
            package: win32-x64-msvc
            binary: cc-proxy-native.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - run: cargo test --manifest-path native/Cargo.toml
      - run: cargo build --manifest-path native/Cargo.toml --release
      - name: Stage native artifact
        shell: bash
        run: |
          mkdir -p native-artifact
          cp "../.cc-proxy-target/release/${{ matrix.binary }}" native-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.package }}
          path: native-artifact/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Package and create GitHub release
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage offline binaries
        run: |
          mkdir -p bin/linux-x64-gnu bin/darwin-x64 bin/darwin-arm64 bin/win32-x64-msvc
          cp artifacts/native-linux-x64-gnu/cc-proxy-native bin/linux-x64-gnu/
          cp artifacts/native-darwin-x64/cc-proxy-native bin/darwin-x64/
          cp artifacts/native-darwin-arm64/cc-proxy-native bin/darwin-arm64/
          cp artifacts/native-win32-x64-msvc/cc-proxy-native.exe bin/win32-x64-msvc/
          chmod +x bin/linux-x64-gnu/cc-proxy-native bin/darwin-x64/cc-proxy-native bin/darwin-arm64/cc-proxy-native
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml
      - name: Build, validate, and clean-install the offline package
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          npm run build:release
          mkdir release
          npm pack --pack-destination release
          PACKAGE_TARBALL="release/cc-proxy-$PACKAGE_VERSION.tgz"
          for path in \
            package/bin/linux-x64-gnu/cc-proxy-native \
            package/bin/darwin-x64/cc-proxy-native \
            package/bin/darwin-arm64/cc-proxy-native \
            package/bin/win32-x64-msvc/cc-proxy-native.exe; do
            tar -tzf "$PACKAGE_TARBALL" | grep -Fx "$path"
          done
          INSTALL_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSTALL_DIR"' EXIT
          printf '{"private":true}\n' > "$INSTALL_DIR/package.json"
          npm install --offline --ignore-scripts --no-audit --no-fund --cache "$INSTALL_DIR/npm-cache" "$GITHUB_WORKSPACE/$PACKAGE_TARBALL" --prefix "$INSTALL_DIR"
          node "$INSTALL_DIR/node_modules/cc-proxy/dist/cli.js" --version
          cat > "$INSTALL_DIR/verify-install.cjs" <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');
          const { join } = require('node:path');

          const installDir = process.argv[2];
          const configPath = join(installDir, 'config.json');
          writeFileSync(
            configPath,
            JSON.stringify({
              baseUrl: 'http://127.0.0.1:1/v1',
              apiKey: 'clean-install',
              models: { opus: 'mock', sonnet: 'mock', haiku: 'mock' },
            })
          );
          const native = require(join(installDir, 'node_modules', 'cc-proxy', 'dist', 'native.js'));
          (async () => {
            const server = await native.startNativeServer(configPath, 0);
            const stopStarted = Date.now();
            await server.stop();
            if (Date.now() - stopStarted >= 2000) {
              throw new Error('native graceful shutdown exceeded 2 seconds');
            }
            const failed = spawnSync(native.resolveNativeBinary(), [
              '--config',
              join(installDir, 'missing.json'),
              '--port',
              '0',
            ]);
            if (failed.status === 0) throw new Error('native startup failure was not reported');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node "$INSTALL_DIR/verify-install.cjs" "$INSTALL_DIR"
          git archive --format=zip --output "release/cc-proxy-v$PACKAGE_VERSION-source.zip" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip release/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" release/*.zip release/*.tgz --title "$RELEASE_TAG" --generate-notes
          fi
